name: Deploy

# The Fly.io "deploy" job below only runs on a manual dispatch now -- the
# account has an unpaid invoice (Fly no longer has a truly free tier without
# a card on file) and the app moved to GitHub Pages (see deploy-pages.yml)
# instead of paying it. Lint & Test still runs on every push as CI signal.
# Re-enable by adding `push: branches: [main]` back once/if Fly billing is
# sorted and this deploy target is wanted again.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Backend tests
        working-directory: backend
        run: pytest

  deploy:
    name: Deploy to Fly.io
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions@master
        with:
          args: "deploy -a abc-mundo-api"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
